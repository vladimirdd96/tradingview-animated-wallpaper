<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Wallpaper settings</title><link rel="stylesheet" href="ui.css"></head><body><div class="page"><header><h1>Wallpaper</h1><p>Chart background</p></header><main><div class="settings-row enable-row"><label for="enabled">Show wallpaper</label><input id="enabled" class="switch" role="switch" type="checkbox"></div><section aria-labelledby="source-title"><h2 id="source-title">Wallpaper</h2><div class="file-row"><svg class="wallpaper-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor"/><circle cx="15.5" cy="9" r="1.5" stroke="currentColor"/><path d="m4 16 5-5 7 8m-3-4 3-3 4 4" stroke="currentColor"/></svg><div class="file-info"><p id="name">Built-in aurora</p><span id="kind">Animated background</span></div><button id="choose" type="button">Choose file…</button><input id="file" type="file" hidden accept="video/mp4,video/webm,image/gif,image/webp,image/png,image/jpeg"></div><p class="hint">MP4, WebM, GIF, WebP, PNG or JPEG · Up to 40 MB</p><button id="aurora" type="button" class="text-button">Use built-in aurora</button></section><section aria-labelledby="appearance-title"><h2 id="appearance-title">Appearance</h2><div class="settings-row"><label for="fit">Fitting</label><select id="fit"><option value="cover">Fill chart</option><option value="contain">Fit entire wallpaper</option></select></div><div class="settings-row dim-row"><label for="dim">Darken</label><div class="range-control"><input id="dim" aria-label="Darken wallpaper" type="range" min="0" max="95" value="45"><output id="amount" for="dim">45%</output></div></div><div class="settings-row"><label for="paused">Pause animation</label><input id="paused" class="switch" role="switch" type="checkbox"></div><p class="hint motion-hint">Applies to video and aurora. Reduced Motion is respected.</p></section><p id="message" class="message" role="status" aria-live="polite"></p></main><footer><div class="footer-status"><span id="connection" role="status">Connecting…</span><span>Changes apply instantly</span></div><div class="footer-actions"><button id="stop" type="button" class="text-button remove-button">Remove from this session</button><button id="done" type="button" class="primary">Done</button></div></footer></div><script src="ui.js"></script></body></html>
